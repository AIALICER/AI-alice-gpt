[project]
name = "ai-alice"
version = "0.1.0"
description = "AI Alice Discord Bot"
dependencies = [
    "discord.py>=2.0.0",
    "google-genai>=1.0.0",
    "aiohttp>=3.8.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["E501"] # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
exclude = ["_deprecated/"]

[tool.bandit]
exclude_dirs = ["tests", "_deprecated"]
skips = ["B101"] # Skip assert check (common in tests/assertions)
