services:
  # アリス Discord Bot
  alice:
    build: .
    container_name: ai-alice
    command: python characters/AL_1S/alice.py
    restart: unless-stopped
    stop_grace_period: 10s
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - shared-network
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

