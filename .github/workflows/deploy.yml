name: Deploy to Server (Self-hosted)

on:
  push:
    branches:
      - main  # mainブランチにプッシュされたときに実行
  workflow_dispatch:  # 手動実行も可能にする

jobs:
  deploy:
    runs-on: self-hosted  # Self-hosted runnerで実行
    
    steps:
      - name: Deploy AI-Alice using host Docker CLI
        run: |
          # Alpine Linuxコンテナを使ってホスト上のDockerコマンドを実行
          /usr/bin/docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /home/aosy/Docker/AI-Alice:/workspace \
            -v /usr/bin/docker:/usr/bin/docker \
            -w /workspace \
            --entrypoint sh \
            alpine:latest -c "\
              apk add --no-cache git bash && \
              git pull origin main && \
              /usr/bin/docker compose down && \
              /usr/bin/docker compose up -d --build && \
              echo '✅ Deployment completed!' && \
              /usr/bin/docker compose ps"

