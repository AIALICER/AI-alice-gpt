name: Deploy to Server (Self-hosted)

on:
  push:
    branches:
      - main  # mainブランチにプッシュされたときに実行
  workflow_dispatch:  # 手動実行も可能にする

jobs:
  deploy:
    runs-on: self-hosted  # Self-hosted runnerで実行
    
    steps:
      - name: Pull latest code
        run: |
          cd /home/aosy/Docker/AI-Alice
          git config --global --add safe.directory /home/aosy/Docker/AI-Alice
          git pull origin main
      
      - name: Rebuild containers
        run: |
          cd /home/aosy/Docker/AI-Alice
          docker compose down
          docker compose up -d --build
      
      - name: Show status
        run: |
          echo "✅ Deployment completed at $(date)"
          cd /home/aosy/Docker/AI-Alice
          docker compose ps
