name: Deploy to Server (Self-hosted)

on:
  push:
    branches:
      - main  # mainブランチにプッシュされたときに実行
  workflow_dispatch:  # 手動実行も可能にする

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted  # Self-hosted runnerで実行
    
    steps:
      - name: Pull latest code
        run: |
          cd /home/aosy/Docker/AI-Alice
          git config --global --add safe.directory /home/aosy/Docker/AI-Alice
          # Use GITHUB_TOKEN for authentication by rewriting SSH URL to HTTPS
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          
          # Pull using existing remote (origin is SSH, but rewritten to HTTPS)
          git pull origin main
          
          # Clean up config (security)
          git config --global --unset url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf
      
      - name: Rebuild containers
        run: |
          cd /home/aosy/Docker/AI-Alice
          docker compose down
          docker compose up -d --build
      
      - name: Show status
        run: |
          echo "✅ Deployment completed at $(date)"
          cd /home/aosy/Docker/AI-Alice
          docker compose ps
