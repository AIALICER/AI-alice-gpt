# 無効化済み: このリポジトリ（AI-alice-gpt）の push で
# 元サーバー /home/aosy/Docker/AI-Alice にデプロイしないため。
# 再有効化する場合は on.push と jobs.deploy.if を戻すこと。

name: Deploy to Server (Self-hosted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: false
    runs-on: self-hosted

    steps:
      - name: Setup SSH for GitHub
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Pull latest code
        run: |
          cd /home/aosy/Docker/AI-Alice
          git config --global --add safe.directory /home/aosy/Docker/AI-Alice
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          current_url=$(git remote get-url origin)
          if [[ "$current_url" == https://* ]]; then
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Aosy0/AI-Alice.git"
          else
            git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          fi
          git fetch origin main
          git checkout main || git checkout -b main origin/main
          git reset --hard origin/main
          if [[ "$current_url" == https://* ]]; then
            git remote set-url origin "$current_url"
          else
            git config --global --unset url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf
          fi

      - name: Check compose file
        run: |
          cd /home/aosy/Docker/AI-Alice
          if [ ! -f compose.yaml ]; then
            echo "compose.yaml not found! Restoring from git history..."
            git show ece9f35:compose.yaml > compose.yaml
          fi

      - name: Rebuild containers
        run: |
          cd /home/aosy/Docker/AI-Alice
          docker compose down
          docker compose up -d --build

      - name: Show status
        run: |
          echo "Deployment completed at $(date)"
          cd /home/aosy/Docker/AI-Alice
          docker compose ps
