name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check . --select E9,F63,F7,F82"

  type-and-security:
    name: Type & Security Check (uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies and tools using uv
        run: |
          uv venv .venv
          uv pip install -r requirements.txt
          uv pip install mypy bandit pip-audit types-requests types-beautifulsoup4

      - name: Run mypy (Type Check)
        run: |
          .venv/bin/mypy . \
            --config-file /dev/null \
            --ignore-missing-imports \
            --disable-error-code var-annotated \
            --disable-error-code import-untyped \
            --disable-error-code assignment \
            --disable-error-code call-arg \
            --disable-error-code arg-type \
            --disable-error-code union-attr \
            --disable-error-code index \
            --disable-error-code attr-defined \
            --disable-error-code operator \
            --disable-error-code call-overload \
            --disable-error-code name-defined

      - name: Run Bandit (Security Check)
        run: .venv/bin/bandit -c pyproject.toml -r characters common check_db.py -lll

      - name: Run pip-audit (Vulnerability Check)
        run: .venv/bin/pip-audit -r requirements.txt

  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy .env for validation
        run: cp .env.example .env || touch .env

      - name: Check Compose YAML
        run: docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image with Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ai-alice:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
